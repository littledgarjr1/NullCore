name: Build Geode Mod

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Create nightly release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes --repo ${{ github.repository }} || true
          gh release create nightly \
            --prerelease \
            --title "Nightly" \
            --notes "Build of ${{ github.sha }}" \
            --target ${{ github.sha }} \
            --repo ${{ github.repository }}

      - name: Upload Geode files
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          mapfile -d '' files < <(find "$BUILD_OUTPUT" -type f -name '*.geode' -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No .geode files found!"
            exit 1
          fi

          gh release upload nightly "${files[@]}" \
            --clobber \
            --repo "${{ github.repository }}"
